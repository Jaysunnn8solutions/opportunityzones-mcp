name: Refresh OZ 1.0 analysis

# Rebuilds the 2018-zone analysis (data/oz1/) with its inputs, on GitHub's
# runners, which can reach census.gov, FFIEC and FHFA: the block crosswalk,
# ACS 2006-10 / 2012-16 / 2013-17 / 2020-24 (including the money measures:
# per-capita income, $100k+ households, SNAP, public assistance, vehicles,
# children, mortgages), CPI, FHFA, HMDA 2018 and 2024, and 2010 tract
# adjacency (pipeline/oz1/refresh.ts). Pushes data/oz1 to the
# data/oz1-refresh branch, to be merged through a pull request.
#
# Needs the repository secret CENSUS_API_KEY (Settings -> Secrets and
# variables -> Actions). A free key: https://api.census.gov/data/key_signup.html
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/refresh-oz1.yml", "pipeline/oz1/refresh.ts"]

permissions:
  contents: write

concurrency:
  group: refresh-oz1
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
    steps:
      - name: Check the Census API key is set
        run: |
          if [ -z "$CENSUS_API_KEY" ]; then
            echo "::error::The repository secret CENSUS_API_KEY is not set. Add it under Settings -> Secrets and variables -> Actions, then run this workflow again."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Downloads (block files, LODES, ACS, HMDA, FHFA) are cached between
      # runs, so a re-run only fetches what changed.
      - uses: actions/cache@v4
        with:
          path: pipeline/cache
          key: refresh-oz1-${{ hashFiles('pipeline/acs/vintages.ts', 'pipeline/hmda/lar.ts') }}
          restore-keys: refresh-oz1-
      - name: Rebuild the OZ 1.0 analysis
        run: npx tsx pipeline/oz1/refresh.ts
      - name: Sizes and new columns
        run: |
          du -sh data/oz1 pipeline/cache || true
          head -1 data/oz1/analysis.csv | tr ',' '\n' | tail -20
      - name: Push to data/oz1-refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B data/oz1-refresh
          # The 2010-2020 tract crosswalk too, so 2018-zone results can be drawn on 2020 tracts.
          mkdir -p data/oz1/crosswalk && cp pipeline/clean/xwalk_t10_t20.csv data/oz1/crosswalk/
          git add data/oz1
          git commit -m "Refresh the OZ 1.0 analysis with the money measures, HMDA 2018/2024 and adjacency

          Generated by the Refresh OZ 1.0 analysis workflow (pipeline/oz1/refresh.ts)."
          git push --force origin data/oz1-refresh

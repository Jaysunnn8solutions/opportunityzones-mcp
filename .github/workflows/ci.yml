name: CI

# Type-check, lint, test and build on every pull request and every push to
# main. Needs no secrets: tests use fixtures and committed data/.
# Dependency installation/advisory checks use the free public npm registry.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release:build

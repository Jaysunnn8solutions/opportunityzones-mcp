name: Refresh map data

# Run on demand (Actions tab, "Run workflow"). GitHub's runners can reach the
# federal services that development sandboxes often cannot, so this job:
#  1. runs the live natural-hazard check (FEMA flood, USGS earthquake, USDA
#     Forest Service wildfire) and prints what each service answers;
#  2. builds the per-state tract files and the counties file from the Census
#     cartographic boundary files (pipeline/map/boundaries.ts);
#  3. pushes public/boundaries to the data/map-boundaries branch, to be merged
#     through a pull request like any other change.
# Needs no secrets. The data is public domain.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Live hazard check (flood, earthquake, wildfire)
        run: npx tsx scripts/check-hazards.ts
        continue-on-error: true
      - name: Build map boundaries
        run: npx tsx pipeline/map/boundaries.ts
      - name: Sizes
        run: |
          du -sh public/boundaries public/boundaries/tracts
          ls -l public/boundaries/tracts | sort -k5 -n | tail -5
      - name: Push to data/map-boundaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B data/map-boundaries
          git add public/boundaries
          git commit -m "Add Census cartographic boundary files for the map

          Generated by the Refresh map data workflow from the Census Bureau's 2024
          cartographic boundary files (pipeline/map/boundaries.ts)."
          git push --force origin data/map-boundaries
